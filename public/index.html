<!DOCTYPE html>
<html lang="vi" data-theme="sumeru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mod Sảnh</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
[data-theme="sumeru"]{--bg:#eaf4df;--bg-card:#ffffff;--text:#1e2e10;--text-dim:#6a8848;--text-bright:#0e1e00;--border:rgba(106,170,56,0.2);--accent:#72bc2a;--accent2:#4e8a18;--accent-glow:rgba(114,188,42,0.15);--danger:#e0432a;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:0.9rem;line-height:1.55;min-height:100vh;padding-bottom:64px}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-weight:900;font-size:1rem;color:var(--accent2);letter-spacing:0.04em}
.page{max-width:640px;margin:0 auto;padding:20px 16px}
.tab-switcher{display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:20px}
.tab-btn{flex:1;background:none;border:none;padding:10px 6px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.78rem;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;border-bottom:2.5px solid transparent}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}
.tab-page{display:none}
.tab-page.active{display:block}
h2{font-size:0.95rem;font-weight:900;margin-bottom:4px;color:var(--text-bright)}
.section-desc{color:var(--text-dim);font-size:0.78rem;margin-bottom:12px}
.section{margin-bottom:26px}

/* wem list */
.wem-item{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.wem-item.selected{border-color:var(--accent);background:var(--accent-glow)}
.wem-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.wem-item.selected .wem-radio{border-color:var(--accent);background:var(--accent)}
.wem-main{flex:1;min-width:0}
.wem-name{font-weight:800;color:var(--text-bright);font-size:0.85rem}
.wem-sub{color:var(--text-dim);font-size:0.68rem;margin-top:1px}
.wem-play-btn{background:var(--bg);border:1.5px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem}
.wem-play-btn.playing{color:var(--accent2);border-color:var(--accent)}

/* video grid */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.video-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer}
.video-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.video-thumb{aspect-ratio:16/9;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent2);overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover}
.video-name{padding:6px 8px;font-size:0.72rem;font-weight:700;color:var(--text-bright)}
.upload-own{border:1.5px dashed var(--border);border-radius:12px;padding:14px;text-align:center;margin-top:10px;cursor:pointer;color:var(--text-dim);font-size:0.78rem;font-weight:700}
.upload-own.has-file{border-color:var(--accent);color:var(--accent2)}

/* form */
input,textarea{width:100%;background:var(--bg-card);border:1.5px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:0.85rem;font-family:'Nunito',sans-serif}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:0.72rem;font-weight:700;color:var(--text-dim);margin:12px 0 5px;text-transform:uppercase;letter-spacing:0.05em}
button.primary{width:100%;font-family:'Nunito',sans-serif;background:var(--accent);color:#fff;border:none;padding:13px 16px;border-radius:10px;font-weight:800;font-size:0.9rem;cursor:pointer;margin-top:18px}
button.primary:disabled{opacity:0.4;cursor:not-allowed}
.msg{font-size:0.8rem;border-radius:9px;padding:10px 12px;margin-top:12px;line-height:1.5;display:none;white-space:pre-wrap}
.msg.ok{display:block;background:var(--accent-glow);border:1px solid var(--accent);color:var(--accent2)}
.msg.err{display:block;background:rgba(224,67,42,0.1);border:1px solid var(--danger);color:var(--danger)}
.progress-wrap{height:5px;background:var(--border);border-radius:5px;overflow:hidden;margin-top:10px;display:none}
.progress-bar{height:100%;width:0%;background:var(--accent);transition:width 0.2s}
.empty{color:var(--text-dim);font-size:0.8rem;padding:10px 0}
</style>
</head>
<body>

<nav><div class="nav-logo">MOD SẢNH</div></nav>

<div class="page">
  <div class="tab-switcher">
    <button class="tab-btn active" data-tab="build">Tạo Mod</button>
    <button class="tab-btn" data-tab="request">Yêu Cầu Wem</button>
  </div>

  <!-- ═══ TAB: TẠO MOD ═══ -->
  <div class="tab-page active" id="tab-build">

    <div class="section">
      <h2>1. Chọn nhạc</h2>
      <div class="section-desc">Bấm vào bài để chọn, bấm nút tròn để nghe thử.</div>
      <div id="wemListBox"><div class="empty">Đang tải...</div></div>
    </div>

    <div class="section">
      <h2>2. Chọn video</h2>
      <div class="section-desc">Chọn từ thư viện, hoặc tự upload video của bồ.</div>
      <div class="video-grid" id="videoGridBox"><div class="empty">Đang tải...</div></div>
      <div class="upload-own" id="uploadOwnBox">
        📤 Hoặc bấm để tự upload video (.mp4)
        <input type="file" id="ownVideoInput" accept="video/mp4" style="display:none">
      </div>
    </div>

    <button class="primary" id="buildBtn" disabled>Chọn nhạc + video để tiếp tục</button>
    <div class="progress-wrap" id="buildProgressWrap"><div class="progress-bar" id="buildProgressBar"></div></div>
    <div class="msg" id="buildMsg"></div>
  </div>

  <!-- ═══ TAB: YÊU CẦU WEM ═══ -->
  <div class="tab-page" id="tab-request">
    <div class="section">
      <h2>Xin bài nhạc chưa có trong thư viện</h2>
      <div class="section-desc">Điền thông tin, admin sẽ liên hệ lại khi có wem.</div>

      <label>Tên/nickname của bồ</label>
      <input type="text" id="reqName" placeholder="vd: Minh">
      <label>Cách liên hệ lại (Zalo / Discord / FB...)</label>
      <input type="text" id="reqContact" placeholder="vd: Zalo 09xxxxxxxx hoặc Discord@abc">
      <label>Tên bài nhạc muốn xin</label>
      <input type="text" id="reqSong" placeholder="vd: Sảnh Tết 2024">
      <label>Ghi chú thêm (tuỳ chọn)</label>
      <textarea id="reqNote" placeholder="Link nhạc mẫu, mùa nào, v.v."></textarea>

      <button class="primary" id="reqSendBtn">Gửi yêu cầu</button>
      <div class="msg" id="reqMsg"></div>
    </div>
  </div>
</div>

<audio id="previewAudio" style="display:none"></audio>

<script>
let wems = [], videos = [];
let selectedWemId = null, selectedVideoId = null, ownVideoFile = null;
let currentPlayingId = null;

const audio = document.getElementById('previewAudio');

// ── tabs ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── load libraries ──
async function loadLibraries() {
  try {
    const [wemRes, vidRes] = await Promise.all([
      fetch('/api/wem-list').then(r => r.json()),
      fetch('/api/video-list').then(r => r.json())
    ]);
    wems = wemRes.wems || [];
    videos = vidRes.videos || [];
    renderWemList();
    renderVideoGrid();
  } catch (e) {
    document.getElementById('wemListBox').innerHTML = `<div class="empty">Lỗi tải thư viện: ${e.message}</div>`;
  }
}

function fmtDuration(ms) {
  if (!ms) return '?';
  const s = Math.round(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function renderWemList() {
  const box = document.getElementById('wemListBox');
  if (!wems.length) { box.innerHTML = '<div class="empty">Thư viện nhạc đang trống.</div>'; return; }
  box.innerHTML = wems.map(w => `
    <div class="wem-item ${w.id === selectedWemId ? 'selected' : ''}" data-wem-id="${w.id}">
      <div class="wem-radio"></div>
      <div class="wem-main">
        <div class="wem-name">${escapeHtml(w.name)}</div>
        <div class="wem-sub">${fmtDuration(w.duration_ms)}</div>
      </div>
      ${w.preview_mp3_url ? `<button class="wem-play-btn" data-play-id="${w.id}" data-url="${w.preview_mp3_url}">▶</button>` : ''}
    </div>`).join('');
}

function renderVideoGrid() {
  const box = document.getElementById('videoGridBox');
  if (!videos.length) { box.innerHTML = '<div class="empty">Thư viện video đang trống.</div>'; return; }
  box.innerHTML = videos.map(v => `
    <div class="video-card ${v.id === selectedVideoId ? 'selected' : ''}" data-video-id="${v.id}">
      <div class="video-thumb">${v.thumbnail_url ? `<img src="${v.thumbnail_url}">` : '🎬'}</div>
      <div class="video-name">${escapeHtml(v.name)}</div>
    </div>`).join('');
}

// ── select wem ──
document.getElementById('wemListBox').addEventListener('click', (e) => {
  const playBtn = e.target.closest('[data-play-id]');
  if (playBtn) {
    e.stopPropagation();
    togglePreview(playBtn.dataset.playId, playBtn.dataset.url, playBtn);
    return;
  }
  const item = e.target.closest('[data-wem-id]');
  if (!item) return;
  selectedWemId = item.dataset.wemId;
  renderWemList();
  updateBuildBtn();
});

function togglePreview(id, url, btn) {
  if (currentPlayingId === id && !audio.paused) {
    audio.pause();
    btn.classList.remove('playing'); btn.textContent = '▶';
    currentPlayingId = null;
    return;
  }
  document.querySelectorAll('.wem-play-btn.playing').forEach(b => { b.classList.remove('playing'); b.textContent = '▶'; });
  audio.src = url;
  audio.play();
  btn.classList.add('playing'); btn.textContent = '⏸';
  currentPlayingId = id;
}
audio.addEventListener('ended', () => {
  document.querySelectorAll('.wem-play-btn.playing').forEach(b => { b.classList.remove('playing'); b.textContent = '▶'; });
  currentPlayingId = null;
});

// ── select video (thư viện hoặc upload riêng — loại trừ nhau) ──
document.getElementById('videoGridBox').addEventListener('click', (e) => {
  const card = e.target.closest('[data-video-id]');
  if (!card) return;
  selectedVideoId = card.dataset.videoId;
  ownVideoFile = null;
  document.getElementById('ownVideoInput').value = '';
  document.getElementById('uploadOwnBox').classList.remove('has-file');
  document.getElementById('uploadOwnBox').textContent = '📤 Hoặc bấm để tự upload video (.mp4)';
  renderVideoGrid();
  updateBuildBtn();
});

document.getElementById('uploadOwnBox').addEventListener('click', () => document.getElementById('ownVideoInput').click());
document.getElementById('ownVideoInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  ownVideoFile = f;
  selectedVideoId = null;
  renderVideoGrid();
  const box = document.getElementById('uploadOwnBox');
  box.classList.add('has-file');
  box.textContent = '✅ ' + f.name;
  updateBuildBtn();
});

function updateBuildBtn() {
  const btn = document.getElementById('buildBtn');
  const ok = selectedWemId && (selectedVideoId || ownVideoFile);
  btn.disabled = !ok;
  btn.textContent = ok ? '🎁 Tạo & tải file' : 'Chọn nhạc + video để tiếp tục';
}

// ── build ──
document.getElementById('buildBtn').addEventListener('click', async () => {
  const msg = document.getElementById('buildMsg');
  const progWrap = document.getElementById('buildProgressWrap');
  const progBar = document.getElementById('buildProgressBar');
  msg.className = 'msg'; msg.style.display = 'none';
  const btn = document.getElementById('buildBtn');
  btn.disabled = true;
  progWrap.style.display = 'block'; progBar.style.width = '20%';

  try {
    const fd = new FormData();
    fd.append('wemId', selectedWemId);
    if (ownVideoFile) fd.append('video', ownVideoFile);
    else fd.append('videoId', selectedVideoId);

    progBar.style.width = '50%';
    const resp = await fetch('/api/build', { method: 'POST', body: fd });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.error || 'Lỗi build không xác định');
    }
    progBar.style.width = '85%';
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Nhac_sanh.zip';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    progBar.style.width = '100%';
    msg.className = 'msg ok'; msg.style.display = 'block';
    msg.textContent = '✅ Đã tạo xong, file đang tải về.';
  } catch (e) {
    msg.className = 'msg err'; msg.style.display = 'block';
    msg.textContent = '⚠ ' + e.message;
  } finally {
    btn.disabled = false;
    updateBuildBtn();
    setTimeout(() => { progWrap.style.display = 'none'; progBar.style.width = '0%'; }, 800);
  }
});

// ── request tab ──
document.getElementById('reqSendBtn').addEventListener('click', async () => {
  const msg = document.getElementById('reqMsg');
  const requesterName = document.getElementById('reqName').value.trim();
  const contact = document.getElementById('reqContact').value.trim();
  const songTitle = document.getElementById('reqSong').value.trim();
  const note = document.getElementById('reqNote').value.trim();
  if (!requesterName || !contact || !songTitle) {
    msg.className = 'msg err'; msg.style.display = 'block';
    msg.textContent = '⚠ Cần điền tên, cách liên hệ, và tên bài nhạc.';
    return;
  }
  const btn = document.getElementById('reqSendBtn');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requesterName, contact, songTitle, note })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Lỗi không xác định');
    msg.className = 'msg ok'; msg.style.display = 'block';
    msg.textContent = '✅ Đã gửi yêu cầu, admin sẽ liên hệ lại qua ' + contact;
    ['reqName','reqContact','reqSong','reqNote'].forEach(id => document.getElementById(id).value = '');
  } catch (e) {
    msg.className = 'msg err'; msg.style.display = 'block';
    msg.textContent = '⚠ ' + e.message;
  } finally {
    btn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadLibraries();
</script>
</body>
</html>
